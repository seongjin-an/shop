---
# AWS Load Balancer Controller (ALB Ingress) 사용 전제
# 설치: helm install aws-load-balancer-controller eks/aws-load-balancer-controller
#        -n kube-system --set clusterName=shop-dev-cluster
#
# 외부 접근:
#   http://<ALB-DNS>/          → shop-frontend:3000
#   http://<ALB-DNS>/gateway/  → shop-gateway:8090  (API 직접 접근 필요 시)
#   http://<ALB-DNS>/grafana/  → grafana:3000       (observability 접근)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop-ingress
  namespace: shop
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/group.name: shop
spec:
  rules:
    - http:
        paths:
          # Gateway API — frontend의 /gateway-api/* 요청이 Next.js SSR에서 리다이렉트됨
          - path: /user
            pathType: Prefix
            backend:
              service:
                name: shop-gateway
                port:
                  number: 8090
          - path: /product
            pathType: Prefix
            backend:
              service:
                name: shop-gateway
                port:
                  number: 8090
          - path: /order
            pathType: Prefix
            backend:
              service:
                name: shop-gateway
                port:
                  number: 8090
          # Frontend — 나머지 모든 경로
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shop-frontend
                port:
                  number: 3000
---
# Grafana 별도 Ingress (선택 — 팀 내부 접근용)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ingress
  namespace: shop
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: shop
spec:
  rules:
    - http:
        paths:
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
