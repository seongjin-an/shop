---
# ECR_REGISTRY: <account-id>.dkr.ecr.<region>.amazonaws.com
# IMAGE_TAG: 이미지 태그 (예: latest, git-commit-sha)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-user
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shop-user
  template:
    metadata:
      labels:
        app: shop-user
      annotations:
        # OTel Operator가 Instrumentation CR을 읽어 Java agent 자동 주입
        instrumentation.opentelemetry.io/inject-java: "true"
    spec:
      containers:
        - name: shop-user
          image: ${ECR_REGISTRY}/shop/shop-user:${IMAGE_TAG}
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: mysql
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: shop-db-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shop-db-credentials
                  key: password
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: OTEL_SERVICE_NAME
              value: shop-user
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: shop-user
  namespace: shop
spec:
  selector:
    app: shop-user
  ports:
    - port: 8080
      targetPort: 8080
