---
# shop-payment: web-application-type=none → management 포트(8085)만 노출
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-payment
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shop-payment
  template:
    metadata:
      labels:
        app: shop-payment
      annotations:
        instrumentation.opentelemetry.io/inject-java: "true"
    spec:
      containers:
        - name: shop-payment
          image: ${ECR_REGISTRY}/shop/shop-payment:${IMAGE_TAG}
          ports:
            - containerPort: 8085   # management 포트
          env:
            - name: DB_HOST
              value: mysql
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: shop-db-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shop-db-credentials
                  key: password
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: OTEL_SERVICE_NAME
              value: shop-payment
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: shop-payment
  namespace: shop
spec:
  selector:
    app: shop-payment
  ports:
    - port: 8085
      targetPort: 8085
