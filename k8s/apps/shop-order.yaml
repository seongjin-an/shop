---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-order
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shop-order
  template:
    metadata:
      labels:
        app: shop-order
      annotations:
        instrumentation.opentelemetry.io/inject-java: "true"
    spec:
      containers:
        - name: shop-order
          image: ${ECR_REGISTRY}/shop/shop-order:${IMAGE_TAG}
          ports:
            - containerPort: 8082
          env:
            - name: DB_HOST
              value: mysql
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: shop-db-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shop-db-credentials
                  key: password
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: OTEL_SERVICE_NAME
              value: shop-order
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: shop-order
  namespace: shop
spec:
  selector:
    app: shop-order
  ports:
    - port: 8082
      targetPort: 8082
