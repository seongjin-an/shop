---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-frontend
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shop-frontend
  template:
    metadata:
      labels:
        app: shop-frontend
    spec:
      containers:
        - name: shop-frontend
          image: ${ECR_REGISTRY}/shop/shop-frontend:${IMAGE_TAG}
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            # Next.js standalone 서버가 시작 시 읽는 값
            # → rewrites()에서 gatsby URL로 사용
            - name: GATEWAY_URL
              value: http://shop-gateway:8090
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: shop-frontend
  namespace: shop
spec:
  selector:
    app: shop-frontend
  ports:
    - port: 3000
      targetPort: 3000
