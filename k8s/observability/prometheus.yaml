---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: shop
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: shop-eks
        env: dev

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ['localhost:9090']
      # OTel Collector 자신 — Collector 장애 감지용 독립 scrape
      - job_name: otel-collector
        static_configs:
          - targets: ['otel-collector:8888']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--web.enable-remote-write-receiver"
            - "--storage.tsdb.retention.time=7d"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: shop
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
