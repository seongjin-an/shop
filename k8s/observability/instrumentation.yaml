apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: shop-java-instrumentation
  namespace: shop
spec:
  # OTel Operator가 inject할 Java agent 버전 (현재 프로젝트와 동일한 2.6.0)
  java:
    image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:2.6.0
    env:
      - name: OTEL_EXPORTER_OTLP_PROTOCOL
        value: grpc
      - name: OTEL_TRACES_EXPORTER
        value: otlp
      # Micrometer가 metrics 처리 → OTel agent는 metrics 비활성
      - name: OTEL_METRICS_EXPORTER
        value: none
      - name: OTEL_LOGS_EXPORTER
        value: otlp
      - name: OTEL_PROPAGATORS
        value: tracecontext,baggage
      - name: OTEL_RESOURCE_ATTRIBUTES
        value: service.namespace=shop,deployment.environment=dev
      # Logback → OTel Logs 연동
      - name: OTEL_INSTRUMENTATION_LOGBACK_APPENDER_ENABLED
        value: "true"
      - name: OTEL_INSTRUMENTATION_LOGBACK_APPENDER_EXPERIMENTAL_CAPTURE_CODE_ATTRIBUTES
        value: "true"
      - name: OTEL_INSTRUMENTATION_LOGBACK_APPENDER_EXPERIMENTAL_CAPTURE_MDC_ATTRIBUTES
        value: "*"
      # Kafka span → saga.id 추적
      - name: OTEL_INSTRUMENTATION_KAFKA_EXPERIMENTAL_SPAN_ATTRIBUTES
        value: "true"
      - name: OTEL_INSTRUMENTATION_KAFKA_PRODUCER_PROPAGATION_ENABLED
        value: "true"
  exporter:
    endpoint: http://otel-collector:4317
  propagators:
    - tracecontext
    - baggage
  sampler:
    type: parentbased_traceidratio
    argument: "1.0"
