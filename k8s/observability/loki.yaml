---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: shop
data:
  loki-config.yml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      reject_old_samples: false
      allow_structured_metadata: true
      volume_enabled: true
      ingestion_rate_mb: 50
      ingestion_burst_size_mb: 100
      max_streams_per_user: 20000
      max_label_name_length: 1024
      max_label_value_length: 2048
      max_label_names_per_series: 30
      max_line_size: 256kb
      max_line_size_truncate: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.0.0
          args: ["-config.file=/etc/loki/loki-config.yml"]
          ports:
            - containerPort: 3100
          volumeMounts:
            - name: config
              mountPath: /etc/loki
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: loki-config
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: shop
spec:
  selector:
    app: loki
  ports:
    - port: 3100
      targetPort: 3100
