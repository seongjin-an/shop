---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-connect
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-connect
  template:
    metadata:
      labels:
        app: kafka-connect
    spec:
      containers:
        - name: kafka-connect
          image: quay.io/debezium/connect:3.1
          env:
            - name: BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: GROUP_ID
              value: debezium-connect-group
            - name: CONFIG_STORAGE_TOPIC
              value: debezium.configs
            - name: OFFSET_STORAGE_TOPIC
              value: debezium.offsets
            - name: STATUS_STORAGE_TOPIC
              value: debezium.statuses
            - name: CONFIG_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: OFFSET_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: STATUS_STORAGE_REPLICATION_FACTOR
              value: "1"
          ports:
            - containerPort: 8083
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /connectors
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-connect
  namespace: shop
spec:
  selector:
    app: kafka-connect
  ports:
    - port: 8083
      targetPort: 8083
