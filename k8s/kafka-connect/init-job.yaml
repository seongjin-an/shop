---
# 1단계: Kafka 토픽 생성 Job
# kafka-connect가 뜨기 전에 먼저 실행 (initOrder 없이 별도 apply)
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics-init
  namespace: shop
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: kafka-topics
          image: confluentinc/cp-kafka:7.5.1
          command: ["/bin/bash", "-c"]
          args:
            - |
              echo "Kafka 토픽 생성 대기..."
              until kafka-topics --bootstrap-server kafka:9092 --list > /dev/null 2>&1; do
                echo "Kafka not ready, waiting 5s..."
                sleep 5
              done

              for TOPIC in \
                product-created \
                order-created \
                stock-reservation-requested \
                stock-reserved \
                stock-reserve-failed \
                stock-confirm-requested \
                stock-release-requested \
                stock-reservation-requested-DLT \
                stock-confirm-requested-DLT \
                stock-release-requested-DLT \
                payment-requested \
                payment-success \
                payment-failed \
                order-canceled \
                debezium.configs \
                debezium.offsets \
                debezium.statuses \
                schema-changes.shop; do
                kafka-topics --bootstrap-server kafka:9092 \
                  --create --if-not-exists \
                  --topic "$TOPIC" \
                  --partitions 3 \
                  --replication-factor 1
                echo "Created: $TOPIC"
              done
              echo "모든 토픽 생성 완료"
---
# 2단계: Debezium 커넥터 등록 Job
# kafka-topics-init 이 완료된 후 실행
apiVersion: batch/v1
kind: Job
metadata:
  name: debezium-connector-init
  namespace: shop
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: register-connector
          image: curlimages/curl:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Kafka Connect 준비 대기..."
              until curl -sf http://kafka-connect:8083/connectors; do
                echo "Kafka Connect not ready, waiting 5s..."
                sleep 5
              done

              echo "Debezium 커넥터 등록..."
              curl -sf -XDELETE http://kafka-connect:8083/connectors/shop-outbox-connector || true

              curl -sf -XPOST http://kafka-connect:8083/connectors \
                -H "Content-Type: application/json" \
                -d @/config/connector.json

              echo "커넥터 등록 완료"
          volumeMounts:
            - name: connector-config
              mountPath: /config
      volumes:
        - name: connector-config
          configMap:
            name: debezium-connector-config
