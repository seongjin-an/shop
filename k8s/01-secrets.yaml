---
apiVersion: v1
kind: Secret
metadata:
  name: shop-db-credentials
  namespace: shop
type: Opaque
stringData:
  username: dev_user
  password: dev_password
  root-password: "1234"
---
# Debezium MySQL connector 등록 시 사용
apiVersion: v1
kind: ConfigMap
metadata:
  name: debezium-connector-config
  namespace: shop
data:
  connector.json: |
    {
      "name": "shop-outbox-connector",
      "config": {
        "connector.class": "io.debezium.connector.mysql.MySqlConnector",
        "database.hostname": "mysql",
        "database.port": "3306",
        "database.user": "debezium",
        "database.password": "debezium",
        "database.server.id": "1",
        "topic.prefix": "shop",
        "database.include.list": "shop",
        "table.include.list": "shop.order_outbox_event,shop.stock_outbox_event,shop.payment_outbox_event,shop.product_outbox_event",
        "schema.history.internal.kafka.bootstrap.servers": "kafka:9092",
        "schema.history.internal.kafka.topic": "schema-changes.shop",
        "transforms": "outbox",
        "transforms.outbox.type": "io.debezium.transforms.outbox.EventRouter",
        "transforms.outbox.route.by.field": "destination_topic",
        "transforms.outbox.route.topic.replacement": "${routedByValue}",
        "transforms.outbox.table.field.event.key": "partition_key",
        "transforms.outbox.table.field.event.id": "event_id",
        "key.converter": "org.apache.kafka.connect.storage.StringConverter",
        "value.converter": "org.apache.kafka.connect.storage.StringConverter"
      }
    }
