server:
  port: 8082

spring:
  application:
    name: shop-order
  datasource:
    hikari:
      jdbc-url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:23306}/shop
      username: ${DB_USER:dev_user}
      password: ${DB_PASSWORD:dev_password}
      driver-class-name: com.mysql.cj.jdbc.Driver
      pool-name: ShopConnectionPool
      minimum-idle: 10
      maximum-pool-size: 20
      idle-timeout: 60000
      connection-timeout: 30000
  jpa:
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        delivery.timeout.ms: 10000
        request.timeout.ms: 3000
        retry.backoff.ms: 100
        partitioner.class: org.apache.kafka.clients.producer.RoundRobinPartitioner
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: latest
      properties:
        allow.auto.create.topics: false
        enable.auto.commit: false
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor

# ─── Actuator (Prometheus scrape) ───────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      access: read_only
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        spring.data.repository.invocations: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
  prometheus:
    metrics:
      export:
        enabled: true
  observations:
    key-values:
      service: ${spring.application.name}

shop:
  kafka:
    topics:
      # ─── 레거시: 호환성 유지 (점진적 마이그레이션 대비) ───
      order-created:
        topic: order-created
        group-id: order-created-group
        concurrency: 1
      order-cancelled:
        topic: order-canceled

      # ─── per-item stock lifecycle (outbound, key=productId) ───
      stock-reservation-requested:
        topic: stock-reservation-requested
      stock-confirm-requested:
        topic: stock-confirm-requested
      stock-release-requested:
        topic: stock-release-requested

      # ─── per-item stock result (inbound from shop-stock) ───
      stock-reserved:
        topic: stock-reserved
        group-id: stock-reserved-order-group
        concurrency: 3
      stock-reserve-failed:
        topic: stock-reserve-failed
        group-id: stock-reserve-failed-order-group
        concurrency: 3

      # ─── payment ───
      payment-requested:
        topic: payment-requested
      payment-success:
        topic: payment-success
        group-id: payment-success-order-group
        concurrency: 1
      payment-failed:
        topic: payment-failed
        group-id: payment-failed-order-group
        concurrency: 1