server:
  port: 8090

spring:
  data:
    redis:
      host: localhost
      port: 16379
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - 'http://localhost:3000'
            allowed-methods: '*'
            allowed-headers: '*'
            allow-credentials: true
      routes:
        - id: user-service
          uri: http://localhost:8080
          predicates:
            - Path=/user/**
          filters:
            - StripPrefix=1

        - id: product-service
          uri: http://localhost:8081
          predicates:
            - Path=/product/**
          filters:
            - StripPrefix=1

        - id: order-service
          uri: http://localhost:8082
          predicates:
            - Path=/order/**
          filters:
            - StripPrefix=1
