
# ─── Actuator 관리 전용 서버 (shop-stock 은 main web 없음) ───
# 관리 서버를 별도 포트 8083 으로 띄워 /actuator/prometheus 노출
management:
  server:
    port: 8083
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      access: read_only
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
  observations:
    key-values:
      service: ${spring.application.name}

spring:
  main:
    web-application-type: none
  application:
    name: shop-stock
  datasource:
    hikari:
      jdbc-url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:23306}/shop
      username: ${DB_USER:dev_user}
      password: ${DB_PASSWORD:dev_password}
      driver-class-name: com.mysql.cj.jdbc.Driver
      pool-name: ShopConnectionPool
      minimum-idle: 10
      maximum-pool-size: 20
      idle-timeout: 60000
      connection-timeout: 30000
  jpa:
    show-sql: true
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        delivery.timeout.ms: 10000
        request.timeout.ms: 3000
        retry.backoff.ms: 100
        partitioner:
          class: org.apache.kafka.clients.producer.RoundRobinPartitioner
    consumer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      auto-offset-reset: latest
      properties:
        allow.auto.create.topics: false
        enable.auto.commit: false
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor
shop:
  kafka:
    topics:
      product-created:
        topic: product-created
        group-id: product-created-group
        concurrency: 1

      # ─── per-item stock lifecycle (inbound, key=productId) ───
      # concurrency 는 파티션 수(3)와 맞춘다. productId 가 키이므로
      # 동일 상품은 반드시 동일 파티션 → 동일 스레드로 흘러간다(단일-writer).
      stock-reservation-requested:
        topic: stock-reservation-requested
        group-id: stock-reservation-requested-group
        concurrency: 3
      stock-confirm-requested:
        topic: stock-confirm-requested
        group-id: stock-confirm-requested-group
        concurrency: 3
      stock-release-requested:
        topic: stock-release-requested
        group-id: stock-release-requested-group
        concurrency: 3

      # 레거시 order-level 구독(order-created / payment-success / order-canceled)
      # 및 관련 DLT 설정은 제거됨. per-item 흐름으로 완전 이관.

      # ─── outbound (shop-stock → shop-order) ───
      stock-reserved:
        topic: stock-reserved
      stock-reserve-failed:
        topic: stock-reserve-failed

      # ─── DLT (per-item 만 유지) ───
      stock-reservation-requested-dlt:
        topic: stock-reservation-requested-DLT
        group-id: stock-reservation-requested-dlt-group
        concurrency: 1
      stock-confirm-requested-dlt:
        topic: stock-confirm-requested-DLT
        group-id: stock-confirm-requested-dlt-group
        concurrency: 1
      stock-release-requested-dlt:
        topic: stock-release-requested-DLT
        group-id: stock-release-requested-dlt-group
        concurrency: 1