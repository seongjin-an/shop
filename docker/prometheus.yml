# Prometheus — receiver 전용 (v2.1)
# ──────────────────────────────────────────────────────────────────
# v2.0 까지는 Prometheus 가 Spring Boot Actuator / kafka-exporter 를 직접 scrape 했음.
# v2.1 에서 OTel Collector 를 Gateway 로 두는 k8s-ready 구조로 전환.
#
#   [앱]  --Actuator /prometheus-->  Collector  --remote_write-->  Prometheus
#   [kafka-exporter]  --/metrics-->  Collector  --remote_write-->  Prometheus
#   [Tempo metrics_generator]       --remote_write-->              Prometheus
#
# 장점:
#   - EKS 이주 시 ServiceMonitor/PodMonitor 복잡도를 Collector 로 이전
#   - TSDB 교체(Mimir/Thanos/AMP) 가 Collector exporter 한 줄 수정으로 끝남
#   - Micrometer 네이티브 메트릭 이름 유지 → 기존 대시보드/PromQL 무수정
#
# remote_write 수신은 compose.yaml 의
#   --web.enable-remote-write-receiver  플래그로 활성.
# ──────────────────────────────────────────────────────────────────

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: shop-local
    env: dev

scrape_configs:
  # Prometheus 자기 자신
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # ─── 유일한 직접 scrape 대상: OTel Collector 자신 ───
  # Collector 가 죽으면 모든 메트릭이 끊기므로, Collector 만큼은
  # Prometheus 가 독립적으로 감지해야 한다 (self-observability 원칙).
  # EKS 에서도 Collector Pod /metrics:8888 을 별도 scrape 하는 게 관행.
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8888']
