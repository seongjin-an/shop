# Tempo: 단일 바이너리(로컬 개발용) 설정
# 참고: https://grafana.com/docs/tempo/latest/configuration/

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m       # 로컬 개발에서는 짧게
  trace_idle_period: 10s

compactor:
  compaction:
    block_retention: 24h        # 로컬은 하루만 보관

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# ──────────────────────────────────────────
# metrics_generator: trace → RED / service-graph 메트릭 생성
# 생성된 메트릭은 Prometheus 로 remote_write push
# ──────────────────────────────────────────
metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: shop-local
  processor:
    service_graphs:
      # 서비스 간 요청 횟수 / latency / 에러율
      dimensions: [service.namespace, deployment.environment]
    span_metrics:
      # span 단위 RED (Rate, Error, Duration)
      dimensions: [service.namespace, span.name, span.kind, status.code]
      histogram_buckets: [0.002, 0.004, 0.008, 0.016, 0.032, 0.064, 0.128, 0.256, 0.512, 1.024, 2.048, 4.096]
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]   # ← 테넌트 레벨 활성화
